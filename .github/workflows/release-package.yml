name: Node.js CI

on:
  release:
    types: [published]
jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'
      - run: yarn
      - run: yarn compile
      - run: yarn build
      - name: Publish to NPM registry
        run: npm publish
